# factory control-plane config. Symlinked from ~/.config/factory/factory.toml.

[paths]
db = "~/.hermes/factory.db"
mirrors = "~/.hermes/factory/mirrors"
dispatches = "~/factory/dispatches"

[secrets]
# KEY=VALUE files; environment variables win. Values are never logged.
env_files = ["~/.config/secrets/agents.env", "~/.config/secrets/dagster-cloud.env", "~/.config/secrets/factory.env"]

[linear]
teams = ["FIN"]
active_state_types = ["unstarted", "started"]   # triage and backlog excluded
# Only tickets whose canonical Domain: project is led by this Linear user are the factory's
# concern (niko = aaron.gumapac@finks.ai). Everything else is ignored: no verdict, no write-back.
lead = "aaron.gumapac@finks.ai"
# Owned by the lead's domain but decided not factory work (operator call). Excluded everywhere.
# FIN-3852: fix is in finks-frontend (no factory owner), Khel has it (2026-09-29).
ignore = ["FIN-3852"]

# Per-team workflow names, confirmed against Linear 2026-09-29.
# FIN has no "In Review": the started-type review state is "Ready for QA".
# "Ready for Prod" is completed-type in FIN. A "Duplicate" state (type duplicate) exists,
# but duplicate-of verdicts close to canceled_state per decision.
[linear.team.FIN]
todo_state = "Todo"
review_state = "Ready for QA"
done_state = "Done"
canceled_state = "Canceled"

[kanban]
# factory.db is authoritative. false = factory card writes only factory.db.
enabled = true
board = "factory"

[prune]
batch = 2

[stage]
max_tickets = 3
# Other fleets' backlogs (read-only). A ticket named in any of them is theirs; stage skips it.
foreign_backlogs = ["~/.local/share/firstmate/homes/*/data/backlog.md"]

# ---------------------------------------------------------------- repos
# trunk = the branch PRs land on. Verified with git ls-remote 2026-09-29: repo-map's
# dev_target "dev" is stale for finks-prism and finks-insights-service (no dev branch).
[repos."Finks-ai/finks-dagster"]
trunk = "main"
[repos."Finks-ai/finks-api"]
trunk = "main"
[repos."Finks-ai/finks-prism"]
trunk = "main"
[repos."Finks-ai/finks-insights-service"]
trunk = "main"
[repos."Finks-ai/finks-overwatch"]
trunk = "main"
[repos."Finks-ai/finks-portfolio-service"]
trunk = "main"
[repos."Finks-ai/finks-clustering-service"]
trunk = "main"

# ---------------------------------------------------------------- bounded contexts
# Keyed on the ticket body's canonical `Domain:` project (finks-ddd: Domain decides
# ownership; labels/assignee/milestone/issue.project never do) or a label.
# A ticket must match exactly one context; a multi-repo domain is narrowed by the
# ticket's `Repo:` line. Otherwise: needs-clarification "no bounded context".
# Seeded 2026-09-29 from the recorded Domain -> repo lines in
# ~/.local/share/firstmate/homes/primary/data/projects.md. Nothing here is inferred.

[[context]]
name = "sec-filings"
repo = "Finks-ai/finks-dagster"
domains = ["SEC Filings"]
witnesses = ["dagster-prod", "clickhouse-serving"]

[[context]]
name = "sec-filings-compute"
repo = "Finks-ai/finks-prism"
domains = ["SEC Filings"]

[[context]]
name = "search-api"
repo = "Finks-ai/finks-api"
domains = ["Search API", "External API Surface"]

[[context]]
name = "insights"
repo = "Finks-ai/finks-insights-service"
domains = ["Insights"]
witnesses = ["clickhouse-serving"]

[[context]]
name = "observability"
repo = "Finks-ai/finks-overwatch"
domains = ["Observability"]

# Added 2026-09-29 by operator decision (these tickets carry no Repo: line or span repos).
[[context]]
name = "finks-data"
repo = "Finks-ai/finks-dagster"
domains = ["Finks Data", "FMP Ingestion Pipeline", "v0 Historical Ratios"]
witnesses = ["dagster-prod", "clickhouse-serving"]

[[context]]
name = "connected-portfolios"
repo = "Finks-ai/finks-portfolio-service"
domains = ["Connected Portfolios"]
witnesses = ["clickhouse-serving"]

# Added 2026-09-29 by operator decision. SEC Filings tickets reach it only via `Repo: finks-clustering-service`
# (FIN-4115). No witness: factory_witness has no grant on clustering_prod.*.
[[context]]
name = "news-clustering"
repo = "Finks-ai/finks-clustering-service"
domains = ["News Clustering", "SEC Filings"]

# ---------------------------------------------------------------- witnesses (all read-only)
[witness.dagster-prod]
kind = "dagster"
readonly = true
url = "https://finks.dagster.cloud/prod/graphql"
token_env = "DAGSTER_CLOUD_API_TOKEN"

# User factory_witness (created 2026-09-29 via /finks/prod/clickhouse-uri `default`): settings profile
# readonly=2, max_execution_time<=5, max_result_rows<=200; SELECT only on system.{tables,parts,columns},
# filings.*, evidence_fabric.*, insights.*, ck_dev.* (market data; the prod secret points here),
# user_data_prod.* (per-user holdings). One Cloud service holds every env's databases.
[witness.clickhouse-serving]
kind = "clickhouse"
readonly = true
url = "https://zqlprdmaw4.us-east-1.aws.clickhouse.cloud:8443"
user_env = "FACTORY_CH_USER"
password_env = "FACTORY_CH_PASSWORD"
