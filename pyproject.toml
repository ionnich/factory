[project]
name = "factory"
version = "0.1.0"
description = "Software factory control plane: Linear ingest, prune verdicts, dispatches, reconcile"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["factory"]

[tool.setuptools.package-data]
factory = ["schema.sql"]
